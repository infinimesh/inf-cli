version: 2

project_name: inf

before:
  hooks:
    - go mod tidy

builds:
  - id: inf
    binary: inf
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/infinimesh/inf-cli/cmd.VERSION={{.Version}}
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - ids:
      - inf
    name_template: "inf_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  github:
    owner: infinimesh
    name: inf-cli

brews:
  - name: inf
    homepage: "https://github.com/infinimesh/inf-cli"
    description: "Command line tool for the infinimesh IoT platform"
    license: "Apache-2.0"
    directory: Formula
    repository:
      owner: infinimesh
      name: inf-cli
      branch: "homebrew/inf-{{ .Version }}"
    commit_author:
      name: "github-actions[bot]"
      email: "41898282+github-actions[bot]@users.noreply.github.com"
    commit_msg_template: "Update the Homebrew formula for inf {{ .Tag }}"
    install: |
      bin.install "inf"
    test: |
      system "#{bin}/inf", "--help"
